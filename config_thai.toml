# Направления: откуда → список куда.
# Отобраны по данным Travelpayouts (10.11.2026, research/thailand.py): Бангкок и Пхукет — в топах
# популярных направлений; Паттайя (У-Тапао), Краби, Самуи, Чиангмай — с ценами из 22–28 городов.
# Чианграй (мало и дорого) и Хуахин (нет билетов) не берём. Из Сибири и с Дальнего Востока
# в Таиланд летают много, поэтому добавлены Владивосток, Иркутск, Хабаровск, Барнаул.
