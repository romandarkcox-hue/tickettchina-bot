# Настройки бота для канала @bilety_dubai (бот @bilety_oae_bot)

[telegram]
# Канал, куда публиковать. Бот должен быть администратором канала с правом публикации.
chat_id = "@bilety_dubai"
# Переменная окружения с токеном бота этого канала (бот канала ОАЭ)
bot_token_env = "UAE_BOT_TOKEN"
# Где помнить, что уже опубликовано
state_file = "state_uae.json"

[search]
currency = "rub"
# true — цена в одну сторону, false — туда-обратно
one_way = true
# Вылеты от сегодня и на сколько дней вперёд
days_ahead = 30
# Только прямые рейсы
direct_only = false
# Максимум пересадок (0 — только прямые)
max_transfers = 1

[posting]
# Всего постов в день (без обратных)
posts_per_run = 7
# Из них самых дешёвых по всем направлениям сразу
cheapest_count = 3
# Плюс самый дешёвый билет из каждого из этих городов, если из него ещё нет билета в топе.
# Остальные места — самые популярные направления (которые чаще всего ищут).
featured_origins = ["MOW", "LED"]
# Плюс N самых популярных маршрутов из стран СНГ (по рейтингу поисков, не больше
# одного из города): билеты оттуда дороже российских и в «самые дешёвые» не попадают.
cis_count = 2
cis_origins = ["ALA", "NQZ", "CIT", "TAS", "SKD", "MSQ", "EVN", "BAK", "TBS", "BSZ", "OSS", "DYU"]
# Как считать популярность: "searches" — рейтинг популярных направлений Aviasales
# с учётом размера города вылета; "cache" — сколько цен в кэше (почти
# у всех маршрутов цены на каждый день, поэтому так их не различить)
popularity = "searches"
# Плюс обратные билеты (из ОАЭ домой): N самых популярных маршрутов по поискам.
# 0 — не публиковать.
reverse_count = 3
# Не больше N обратных из одного города — чтобы были не только из Дубая
reverse_max_per_city = 2
# Часы публикаций по Москве: с 9:05 до 13:35 (запуски каждые 30 минут, по посту за раз)
hours = [9, 14]
# Не повторять тот же билет (направление + дата вылета + цена) N дней. 0 — не проверять.
skip_same_ticket_days = 7

[card]
# Картинка к каждому посту (card.py). Тест: python bot.py --config config_uae.toml --card --chat ID
enabled = true

# Фон — градиент в цветах города ОАЭ (без фото), у обратного билета — тоже город ОАЭ.
# Дубай — ночь и золото, Абу-Даби — белый мрамор и бирюза, Шарджа — синий лазурит.
[card.gradients]
DXB = "dubai"
AUH = "abudhabi"
SHJ = "sharjah"

[links]
# Партнёрский marker Travelpayouts. Пусто — ссылки без партнёрки.
marker = "794600"
# Добавлять к marker метку направления (794600.MOW-DXB) — видно в статистике Travelpayouts
sub_id_per_route = true
# Номер проекта в Travelpayouts: ссылки идут через tp.media, и партнёрка считает клики
trs = 590120
# Токен маркировки рекламы (erid) из кабинета Travelpayouts
erid = "2Vtzqx5PLYd"
# Ссылка на отели (Островок через Travelpayouts) — цитатой под ссылкой на билет.
# Пусто — не добавлять. У обратных билетов не показывается.
hotels_url = "https://ostrovok.tpk.lu/RY2oOsiC?erid=2VtzqxcX5Ts"
hotels_text = "Отели тут"
# Маркировка рекламы Островка — добавляется, только когда в посте есть ссылка на отели
hotels_ad_label = "Реклама. ООО «Бронирование гостиниц», ИНН 7703389880. erid: 2VtzqxcX5Ts"
# Строка о рекламе в конце поста. Пусто — не добавлять.
ad_label = "Реклама. Go Travel Un Limited, ИНН 9909520797. erid: 2Vtzqx5PLYd"

