name: Сторож будильников

# Раз в день проверяет, что будильники cron-job.org сработали: к этому времени у каждого
# канала уже должна быть очередь на сегодня. Если нет — сообщает в личку и публикует
# следующий пост сам, чтобы день не пропал целиком.
# Расписание GitHub опаздывает, поэтому проверка может пройти на час-два позже.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 12:00 по Москве
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: "@tickettchina"
            config: config.toml
            state: state.json
            group: post
          - channel: "@bilety_v_turciyu"
            config: config_turkey.toml
            state: state_turkey.json
            group: post-turkey
          - channel: "@bilety_dubai"
            config: config_uae.toml
            state: state_uae.json
            group: post-uae
    # Та же группа, что у воркфлоу канала: не запускаемся одновременно с обычной публикацией
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить, что сегодня публикации начались
        id: check
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          from datetime import datetime, timedelta, timezone
          today = datetime.now(timezone(timedelta(hours=3))).date().isoformat()
          path = pathlib.Path("${{ matrix.state }}")
          state = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          print("ok=" + ("true" if state.get("queue_date") == today else "false"))
          EOF
      - name: Сообщить, что будильники не сработали
        if: steps.check.outputs.ok == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
            --data-urlencode "text=⚠️ ${{ matrix.channel }}: сегодня ещё ничего не опубликовано — похоже, будильники cron-job.org не сработали. Сторож публикует один пост; проверьте задания на cron-job.org." \
            > /dev/null
      - name: Опубликовать следующий пост
        if: steps.check.outputs.ok == 'false'
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TURKEY_BOT_TOKEN: ${{ secrets.TURKEY_BOT_TOKEN }}
          UAE_BOT_TOKEN: ${{ secrets.UAE_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python bot.py --config ${{ matrix.config }} --next
      - name: Сохранить опубликованные билеты
        if: steps.check.outputs.ok == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ${{ matrix.state }} 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Обновить опубликованные билеты (сторож)"
          git pull --rebase -q && git push
