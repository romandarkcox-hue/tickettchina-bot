name: Постинг билетов

on:
  schedule:
    # Время в UTC: 06:00 UTC = 09:00 по Москве
    - cron: "0 6 * * *"
  workflow_dispatch: # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Найти билеты и опубликовать
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
      - name: Сохранить историю цен
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Обновить историю цен"
          git push
