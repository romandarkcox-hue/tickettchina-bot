name: Постинг билетов

on:
  schedule:
    # Время в UTC: 06:00 UTC = 09:00 по Москве — основной запуск
    - cron: "0 6 * * *"
    # 07:30 UTC = 10:30 по Москве — запасной: публикует, только если основной не сработал
    - cron: "30 7 * * *"
  workflow_dispatch: # кнопка ручного запуска во вкладке Actions (публикует принудительно)

permissions:
  contents: write

# Запуски не идут параллельно: второй ждёт окончания первого
concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Найти билеты и опубликовать
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python bot.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Сохранить опубликованные билеты
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Обновить опубликованные билеты"
          git push
      - name: Сообщить о сбое
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
            --data-urlencode "text=❌ Сбой автопостинга в @tickettchina. Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
